<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container py-5" style="max-width: 600px;">

        <div class="text-center mb-4">
            <div class="add-task-icon">
                <i class="fa-solid fa-list-check"></i>
            </div>

            <h1 class="fw-bold text-dark mb-1">Add a Task</h1>
            <p class="text-muted mb-0">
                Create a new task and keep your classes organized.
            </p>
        </div>

        <div class="todo-card">

            <form action="/add_task" method="post" id="todoForm">

                <!-- Class -->
                <div class="form-group mb-4">
                    <label for="class_name" class="form-label">
                        <i class="fa-solid fa-book me-2"></i>
                        Class
                    </label>

                    <select name="class_name" id="class_name" class="form-select" autocomplete="off" required>

                        {% for class in classes %}
                        <option value="{{ class }}">{{ class }}</option>
                        {% endfor %}

                    </select>
                </div>

                <!-- Task Name -->
                <div class="form-group mb-4">
                    <label for="task_name" class="form-label">
                        <i class="fa-solid fa-pen me-2"></i>
                        Task Name
                    </label>

                    <input type="text" id="task_name" name="task_name" class="form-control"
                        placeholder="e.g. Finish physics lab" autocomplete="off" required>
                </div>

                <!-- Due Date -->
                <div class="form-group mb-4">
                    <label for="due_date" class="form-label">
                        <i class="fa-regular fa-calendar me-2"></i>
                        Due Date
                    </label>

                    <input type="date" id="due_date" name="due_date" class="form-control" autocomplete="off" required>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-add w-100 fw-semibold">
                    <i class="fa-solid fa-plus me-2"></i>
                    Add Task
                </button>

            </form>

        </div>

    </div>

</body>

</html>
