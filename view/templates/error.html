<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container py-5" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h1 class="fw-bold text-dark mb-1">My Tasks</h1>
            <p class="text-muted">A minimal task management list</p>
        </div>

        <div class="todo-card p-4">
            <form id="todoForm" class="d-flex gap-2 mb-4">
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." autocomplete="off" required>
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." autocomplete="off" required>
                <input type="text" id="taskInput" class="form-control" placeholder="Enter a new task..." autocomplete="off" required>
                <button type="submit" class="btn btn-add px-4 fw-semibold text-nowrap">
                    <i class="fa-solid fa-plus me-1"></i> Add Task
                </button>
            </form>

            <ul id="taskList" class="list-unstyled mb-0 d-flex flex-column gap-2">
            </ul>

            <div id="emptyMessage" class="text-center py-4 text-muted d-none">
                <p class="mb-0 fs-6">No tasks yet! Add one above to get started.</p>
            </div>
        </div>
    </div>
</body>
</html>
