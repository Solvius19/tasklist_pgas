<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Task List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container py-5" style="max-width: 600px;">

        <div class="text-center mb-4">
            <h1 class="fw-bold text-dark mb-1">Error</h1>
            <p class="text-muted">An error occurred while processing your request.</p>
        </div>

        <div class="todo-card p-6">
            <div class="alert alert-danger" role="alert">
                {{ message }}
            </div>
            <a href="{{ url_for('index') }}" class="btn btn-primary">Go Back to Home</a>
        </div>
    </div>
</body>
</html>
